dismiss:
  name: Dismiss
  description: >-
    Clear one Needs you row for good. The dismissal is keyed to the specific
    occurrence, so a recurring item such as the bins comes back next time
    rather than never.
  fields:
    item_id:
      name: Item
      description: The row's id, from the sensor's items attribute.
      required: true
      example: bin_2026-09-16
      selector:
        text:

snooze:
  name: Snooze
  description: Hide one Needs you row for a while, then let it come back.
  fields:
    item_id:
      name: Item
      description: The row's id, from the sensor's items attribute.
      required: true
      example: offline
      selector:
        text:
    hours:
      name: Hours
      description: How long to hide it for.
      default: 8
      selector:
        number:
          min: 1
          max: 168
          unit_of_measurement: hours

reset:
  name: Reset dismissals
  description: >-
    Bring every dismissed and snoozed row back. The escape hatch for when a
    rule misfires and something has been cleared that should not have been.

laundry_hung:
  name: Laundry hung
  description: >-
    One load of washing is up. Clears the load at source rather than hiding
    a row, so the wall button, the Needs you list and the appliance card
    cannot disagree about how many are waiting.
  fields:
    load_id:
      name: Load
      description: >-
        The specific load, from the appliance's pending attribute. Omit it
        to clear the oldest, which is what the wall button sends.
      example: washing_machine_2026-09-19T20-26
      selector:
        text:
    appliance:
      name: Appliance
      description: Which machine, by slug. Omit for all of them.
      example: washing_machine
      selector:
        text:
    source:
      name: Source
      description: >-
        Where the press came from. Only the wall button is recorded in the
        activity feed, because the feed answers "where are people in the
        house" and the button is the only caller whose location is known -
        a screen may be the panel in the kitchen or a phone anywhere.
      default: ui
      selector:
        select:
          options:
            - label: Wall button
              value: button
            - label: A screen
              value: ui

save_recipe:
  name: Save recipe
  description: >-
    Create a recipe in Mealie, or change one. Name a recipe to change it;
    leave it out to create a new one, which then needs a name. Anything not
    given is left as it is. An ingredient line that has not changed keeps
    Mealie's own parse of it. Answers with the recipe's slug, id and name.
  fields:
    recipe:
      name: Recipe
      description: The slug or id of the recipe to change. Omit to create one.
      example: nanas-curry
      selector:
        text:
    name:
      name: Name
      example: Nana's curry
      selector:
        text:
    description:
      name: Description
      selector:
        text:
          multiline: true
    total_time:
      name: Total time
      example: 45 minutes
      selector:
        text:
    servings:
      name: Servings
      selector:
        number:
          min: 1
          max: 50
          mode: box
    ingredients:
      name: Ingredients
      description: One per line. Replaces the whole list.
      example: "2 onions\n1 tin chopped tomatoes"
      selector:
        text:
          multiline: true
    method:
      name: Method
      description: One step per line. Replaces the whole method.
      selector:
        text:
          multiline: true
    tags:
      name: Tags
      description: >-
        Tag names, replacing the recipe's tags. Tags Mealie does not have yet
        are created. Matched ignoring case.
      example: "Dinner, Quick, Chicken"
      selector:
        text:
          multiple: true
    favourite:
      name: Favourite
      description: Whether it is a favourite of the Mealie user whose token this is.
      selector:
        boolean:
    prep:
      name: Prep and cook
      description: >-
        Split the method into prep ahead and to cook. {mode: split, steps: [...]}
        where the method's first steps are the prep, one timing each
        (ahead_max and ahead_min in hours, keeps, minutes, source);
        {mode: none} for nothing to do ahead; {mode: order} to take it off.
        An unchecked split may carry original, the method's lines as they
        were, kept until it is checked.
      example: '{"mode": "split", "steps": [{"ahead_max": 24, "ahead_min": 1, "keeps": "fridge", "minutes": 10}]}'
      selector:
        object:
    config_entry_id:
      name: Mealie
      description: Which Mealie, if there is more than one.
      selector:
        config_entry:
          integration: mealie

import_recipe:
  name: Import recipe
  description: >-
    Import a recipe into Mealie from a web page or a video link, waiting up
    to five minutes for it. A page with no recipe data is read by Mealie's AI
    provider and a video is transcribed, either of which can take a minute.
    Answers with the recipe's slug, id and name.
  fields:
    url:
      name: Link
      description: The recipe page or video.
      required: true
      example: https://www.youtube.com/shorts/ekOjr2XP_zU
      selector:
        text:
          type: url
    config_entry_id:
      name: Mealie
      description: Which Mealie, if there is more than one.
      selector:
        config_entry:
          integration: mealie

delete_recipe:
  name: Delete recipe
  description: >-
    Delete a recipe from Mealie. A meal already planned with it loses its
    recipe.
  fields:
    recipe:
      name: Recipe
      description: The slug or id of the recipe.
      required: true
      selector:
        text:
    config_entry_id:
      name: Mealie
      description: Which Mealie, if there is more than one.
      selector:
        config_entry:
          integration: mealie

recipe_index:
  name: Recipe index
  description: >-
    Every recipe in Mealie with what a picker filters on: tags, ingredient
    lines, the day it was last made, the day it was added and whether it is
    a favourite. Each full recipe is read once and kept until Mealie says it
    changed, so a repeat is quick.
  fields:
    config_entry_id:
      name: Mealie
      description: Which Mealie, if there is more than one.
      selector:
        config_entry:
          integration: mealie

mark_made:
  name: Mark made
  description: >-
    Record that a recipe was eaten on a day, today unless a date is given.
    Never moves the date backwards.
  fields:
    recipe:
      name: Recipe
      description: The slug or id of the recipe.
      required: true
      selector:
        text:
    date:
      name: Date
      description: The day it was eaten.
      selector:
        date:
    config_entry_id:
      name: Mealie
      description: Which Mealie, if there is more than one.
      selector:
        config_entry:
          integration: mealie

prune_tags:
  name: Prune tags
  description: >-
    Delete every Mealie tag that no recipe uses, and answer with their names.
    Tags are made as recipes are tagged; this tidies the ones left behind.
  fields:
    config_entry_id:
      name: Mealie
      description: Which Mealie, if there is more than one.
      selector:
        config_entry:
          integration: mealie

save_photo:
  name: Save photo
  description: >-
    Keep a photo sent by a card in local media, so an AI task can take it as
    an attachment. Answers with its media_content_id and media_content_type.
    Only the newest twelve in each folder are kept.
  fields:
    image:
      name: Photo
      description: A JPEG, PNG or WebP as base64, or as a data URL. Under 3 MB.
      required: true
      selector:
        text:
    folder:
      name: Folder
      description: Where under local media/home_signals to keep it.
      default: photos
      example: fridge
      selector:
        text:

save_prep_session:
  name: Save prep session
  description: >-
    Plan one sitting of meal prep: when it has to be done by, and which meals'
    ahead-of-time steps it covers. Kept as one Home Tasks item with that
    deadline, created or updated. Give no items to remove the session.
  fields:
    id:
      name: Session
      description: The session to change. Leave out to start a new one.
      selector:
        text:
    due:
      name: Due
      description: When the prep has to be done by.
      required: true
      selector:
        datetime:
    items:
      name: Meals
      description: >-
        One per meal: date, entry_type, name, and optionally recipe_id, slug,
        steps (the prep steps as text) and minutes.
      required: true
      example: '[{"date": "2026-09-29", "entry_type": "dinner", "name": "Chilli", "steps": ["Chop the onions"], "minutes": 15}]'
      selector:
        object:
    title:
      name: Title
      description: The task's name. Defaults to "Prep:" and the meals.
      selector:
        text:

remove_prep_session:
  name: Remove prep session
  description: Forget a prep session and remove its Home Tasks item.
  fields:
    id:
      name: Session
      required: true
      selector:
        text:

prep_done:
  name: Prep done
  description: Tick a prep session's Home Tasks item.
  fields:
    id:
      name: Session
      required: true
      selector:
        text:

prep_settings:
  name: Prep settings
  description: When meals are eaten, when prep usually happens, and which list holds it.
  fields:
    meal_times:
      name: Meal times
      example: '{"breakfast": "07:00", "lunch": "12:00", "dinner": "17:00"}'
      selector:
        object:
    prep_times:
      name: Prep times
      description: Weekdays are 0 (Monday) to 6 (Sunday).
      example: '[{"label": "Sunday afternoon", "days": [6], "time": "16:00"}]'
      selector:
        object:
    todo:
      name: List
      selector:
        entity:
          domain: todo
